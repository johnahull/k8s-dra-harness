name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh

      - name: Run unit tests
        run: go test ./...

      - name: Compile integration suite
        run: go test -tags=integration ./tests/dra -run '^$'

      - name: Check container targets
        run: make -n container-build container-push

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build harness image
        run: docker build --file Containerfile --tag k8s-dra-harness:ci .

      - name: Smoke-test harness entrypoint
        run: docker run --rm k8s-dra-harness:ci help

      - name: Check bundled tools
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash k8s-dra-harness:ci -c '
            set -euo pipefail
            command -v go
            command -v ginkgo
            command -v kubectl
            command -v helm
            command -v oc
            go version
