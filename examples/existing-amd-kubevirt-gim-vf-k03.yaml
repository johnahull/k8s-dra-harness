# K-03: hold the GIM VF-backed VMI while the DRA plugin is restarted.
existing: true
workload: kubevirt
kubevirt:
  allowExisting: true
  namespace: dra-kubevirt-gim-vf-k03
  image: quay.io/containerdisks/fedora:42
  attachment: gpu
  holdAfterReadySeconds: 180
  selector: 'device.attributes["gpu.amd.com"].type == "vfio"'
  claimConfig:
    driver: gpu.amd.com
    parameters:
      apiVersion: gpu.resource.amd.com/v1alpha1
      kind: VfioDeviceConfig
      iommu:
        backendPolicy: LegacyOnly
drivers:
  - name: amd
    namespace: dra-pr122-vfio-lifecycle
